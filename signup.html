<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexiway - Crear cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template/layout.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { margin: 0; background: #fffaf7; color: #3a2c2a; font-family: 'Tinos', serif; }
    .main-header { background: #e9a6b2; color: #fff7e6; border-bottom: 1px solid #d97a8a; }
    .main-header .logo { color: #fff7e6; font-family: 'Cormorant Garamond', serif; font-size: 2rem; text-decoration: none; }
    .header-actions .icon-btn { background: rgba(255,255,255,0.18); color: #fff7e6; }
    .content { max-width: 520px; margin: 40px auto; padding: 0 20px; }
    .card { background: #fff; border-radius: 22px; padding: 28px; border: 1px solid rgba(217,122,138,0.2); box-shadow: 0 10px 26px rgba(233,166,178,0.12); }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.6rem; margin-top: 0; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 700; }
    input { width: 100%; box-sizing: border-box; border: 1px solid rgba(217,122,138,0.4); border-radius: 10px; padding: 12px; }
    .password-field { position: relative; }
    .password-field input { padding-right: 52px; }
    .password-toggle { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 999px; background: rgba(233,166,178,0.12); color: #8d5260; cursor: pointer; }
    .password-toggle:hover { background: rgba(233,166,178,0.2); }
    .password-toggle svg { pointer-events: none; }
    button[type="submit"] { border: none; border-radius: 999px; padding: 12px 16px; background: #e9a6b2; color: #fff7e6; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <header class="main-header">
    <button onclick="history.back()" class="icon-btn" aria-label="Volver">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <a href="index.html" class="logo">Flexiway</a>
    <div class="header-actions">
      <button id="notificationBtn" class="icon-btn" aria-label="Notificaciones">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7"></path>
          <path d="M13.73 21a2 2 0 01-3.46 0"></path>
        </svg>
      </button>
      <button id="profileBtn" class="icon-btn" aria-label="Perfil">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="7" r="4"></circle>
          <path d="M5.5 21a8.38 8.38 0 0113 0"></path>
        </svg>
      </button>
    </div>
  </header>

  <section class="content">
    <article class="card">
      <h1>Crear cuenta</h1>
      <form id="signupForm">
        <label>Nombre<input name="name" required></label>
        <label>Email<input name="email" type="email" autocomplete="email username" required></label>
        <label>
          Contrasena
          <span class="password-field">
            <input id="signupPassword" name="password" type="password" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-toggle-password="signupPassword" aria-label="Mostrar contrasena" aria-pressed="false">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </span>
        </label>
        <label>
          Confirmar contrasena
          <span class="password-field">
            <input id="signupConfirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-toggle-password="signupConfirmPassword" aria-label="Mostrar contrasena" aria-pressed="false">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </span>
        </label>
        <button type="submit">Crear cuenta</button>
      </form>
    </article>
  </section>

  <script src="app/supabase-config.js"></script>
  <script src="app/finance-session.js"></script>
  <script src="app/finance-sync.js"></script>
  <script src="app/finance.js"></script>
  <script src="app/alerts.js"></script>
  <script src="template/layout.js"></script>
  <script>
    document.querySelectorAll('[data-toggle-password]').forEach(function(button) {
      button.addEventListener('click', function() {
        const input = document.getElementById(button.dataset.togglePassword);
        const isVisible = input.type === 'text';
        input.type = isVisible ? 'password' : 'text';
        button.setAttribute('aria-label', isVisible ? 'Mostrar contrasena' : 'Ocultar contrasena');
        button.setAttribute('aria-pressed', String(!isVisible));
      });
    });

    document.getElementById('signupForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      const submitButton = this.querySelector('button[type="submit"]');
      const originalLabel = submitButton.textContent;
      submitButton.disabled = true;
      submitButton.textContent = 'Creando...';

      try {
        const payload = Object.fromEntries(new FormData(this).entries());
        if (payload.password !== payload.confirmPassword) {
          window.showError('Las contrasenas no coinciden.');
          return;
        }
        const result = await window.FlexiwayFinance.signUpUser(payload);
        if (!result.ok) {
          window.showError(result.message);
          return;
        }
        if (result.requiresEmailConfirmation) {
          window.showSuccess('Cuenta creada. Revisa tu correo para confirmar el acceso.');
          window.location.href = 'login.html';
          return;
        }
        window.showSuccess(result.message || 'Cuenta creada.');
        window.location.href = 'profile.html';
      } catch (error) {
        console.error('No se pudo crear la cuenta.', error);
        window.showError('No se pudo crear la cuenta. Revisa la conexion e intentalo otra vez.');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = originalLabel;
      }
    });
  </script>
</body>
</html>
