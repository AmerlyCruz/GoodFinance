<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexiway - Crear cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template/layout.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { margin: 0; background: #fffaf7; color: #3a2c2a; font-family: 'Tinos', serif; }
    .main-header { background: #e9a6b2; color: #fff7e6; border-bottom: 1px solid #d97a8a; }
    .main-header .logo { color: #fff7e6; font-family: 'Cormorant Garamond', serif; font-size: 2rem; text-decoration: none; }
    .header-actions .icon-btn { background: rgba(255,255,255,0.18); color: #fff7e6; }
    .content { max-width: 520px; margin: 40px auto; padding: 0 20px; }
    .card { background: #fff; border-radius: 22px; padding: 28px; border: 1px solid rgba(217,122,138,0.2); box-shadow: 0 10px 26px rgba(233,166,178,0.12); }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.6rem; margin-top: 0; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 700; }
    input { border: 1px solid rgba(217,122,138,0.4); border-radius: 10px; padding: 12px; }
    button[type="submit"] { border: none; border-radius: 999px; padding: 12px 16px; background: #e9a6b2; color: #fff7e6; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <header class="main-header">
    <button onclick="history.back()" class="icon-btn" aria-label="Volver">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <a href="index.html" class="logo">Flexiway</a>
    <div class="header-actions">
      <button id="notificationBtn" class="icon-btn" aria-label="Notificaciones">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7"></path>
          <path d="M13.73 21a2 2 0 01-3.46 0"></path>
        </svg>
      </button>
      <button id="profileBtn" class="icon-btn" aria-label="Perfil">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="7" r="4"></circle>
          <path d="M5.5 21a8.38 8.38 0 0113 0"></path>
        </svg>
      </button>
    </div>
  </header>

  <section class="content">
    <article class="card">
      <h1>Crear cuenta</h1>
      <form id="signupForm">
        <label>Nombre<input name="name" required></label>
        <label>Email<input name="email" type="email" required></label>
        <label>Contrasena<input name="password" type="password" required></label>
        <label>Confirmar contrasena<input name="confirmPassword" type="password" required></label>
        <button type="submit">Crear cuenta</button>
      </form>
    </article>
  </section>

  <script src="app/supabase-config.js"></script>
  <script src="app/finance.js"></script>
  <script src="app/alerts.js"></script>
  <script src="template/layout.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      const payload = Object.fromEntries(new FormData(this).entries());
      if (payload.password !== payload.confirmPassword) {
        window.showError('Las contrasenas no coinciden.');
        return;
      }
      const result = await window.FlexiwayFinance.signUpUser(payload);
      if (!result.ok) {
        window.showError(result.message);
        return;
      }
      if (result.requiresEmailConfirmation) {
        window.showSuccess('Cuenta creada. Revisa tu correo para confirmar el acceso.');
        window.location.href = 'login.html';
        return;
      }
      window.showSuccess('Cuenta creada.');
      window.location.href = 'profile.html';
    });
  </script>
</body>
</html>
